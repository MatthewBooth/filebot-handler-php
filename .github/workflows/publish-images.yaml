name: Build and publish Docker images

on:
    pull_request:
    push:
        branches: [main]
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish:
        name: ${{ matrix.target }} image
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: php
                      role: api
                    - target: worker
                      role: worker

        steps:
            - name: Check out source
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Hub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Generate image metadata
              id: metadata
              uses: docker/metadata-action@v6
              with:
                  images: ${{ secrets.DOCKERHUB_USERNAME || 'dockerhub-username' }}/filebot-handler-php
                  flavor: latest=false
                  tags: |
                      type=raw,value=${{ matrix.role }}-latest,enable={{is_default_branch}}
                      type=sha,prefix=${{ matrix.role }}-sha-
                      type=semver,pattern={{version}},prefix=${{ matrix.role }}-
                      type=semver,pattern={{major}}.{{minor}},prefix=${{ matrix.role }}-

            - name: Build and publish image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile
                  target: ${{ matrix.target }}
                  platforms: linux/amd64
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.target }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.target }}
