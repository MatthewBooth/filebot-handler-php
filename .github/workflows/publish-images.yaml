
name: Build and publish Docker images

on:
    pull_request:
    push:
        branches: [main, develop]
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

    # ==========================================================
    # 1. PHPUNIT TESTS
    # ==========================================================

    test:
        name: PHPUnit Tests
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        env:
            APP_ENV: test
            APP_DEBUG: "1"
            APP_SECRET: test-only-secret
            TRUSTED_PROXIES: 127.0.0.1
            DEFAULT_URI: http://localhost
            MESSENGER_TRANSPORT_DSN: in-memory://
            HOSTNAME: phpunit-builder

        steps:
            - name: Check out source
              uses: actions/checkout@v6

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring, pdo_mysql, zip, redis
                  coverage: none
                  tools: composer:v2
              env:
                  fail-fast: true

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      composer-${{ runner.os }}-php84-

            - name: Install dependencies
              run: |
                  composer install \
                    --prefer-dist \
                    --no-interaction \
                    --no-progress \
                    --no-scripts

            - name: Install ImportMap assets
              run: php bin/console importmap:install

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --configuration=phpstan.dist.neon --no-progress

            - name: Run PHPUnit tests
              run: php bin/phpunit --testdox

    # ==========================================================
    # 2. BUILD AND PUBLISH DOCKER IMAGES
    # ==========================================================

    publish:
        name: ${{ matrix.target }} image
        needs: test
        runs-on: ubuntu-24.04
        timeout-minutes: 60

        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: php
                      repository: filebot-handler-api
                    - target: worker
                      repository: filebot-handler-worker
                    - target: nginx
                      repository: filebot-handler-nginx

        steps:
            - name: Check out source
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Hub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Generate image metadata
              id: metadata
              uses: docker/metadata-action@v6
              with:
                  images: ${{ secrets.DOCKERHUB_USERNAME || 'dockerhub-username' }}/${{ matrix.repository }}
                  flavor: latest=false
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=branch
                      type=sha,format=long
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}

            - name: Build and publish image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile
                  target: ${{ matrix.target }}
                  platforms: linux/amd64

                  push: ${{ github.event_name != 'pull_request' }}

                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}

                  sbom: ${{ github.event_name != 'pull_request' }}

                  cache-from: |
                      type=gha,scope=${{ matrix.target }}
                      type=gha,scope=php

                  cache-to: type=gha,mode=max,scope=${{ matrix.target }}
