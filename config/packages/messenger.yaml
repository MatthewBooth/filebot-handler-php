framework:
    messenger:
        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 0

        routing:
            # Route your messages to the transports
            App\Message\FilebotJobMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
