x-worker: &worker
    image: filebot-handler-worker:dev
    build:
        context: .
        target: worker
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    restart: unless-stopped
    volumes:
        - ./:/app
        - "${DOWNLOAD_VOL}:${TORRENTS_ROOT}:rw"
        - "${STORAGE_VOL}:${STORAGE_ROOT}:rw"
        - "${FILEBOT_VOL}:${FILEBOT_HOME}:rw"
    environment:
        APP_ENV: dev
        HOME: "${FILEBOT_HOME}"
        TZ: "${TZ:-UTC}"
        FILEBOT_OPTS: "${FILEBOT_OPTS}"
        FILEBOT_LICENCE_FILE: "${FILEBOT_LICENCE_FILE}"
        AMC_UNSORTED: "${AMC_UNSORTED:-n}"
        OPENSUBTITLES_USERNAME: "${OPENSUBTITLES_USERNAME:-}"
        OPENSUBTITLES_PASSWORD: "${OPENSUBTITLES_PASSWORD:-}"
    depends_on:
        redis:
            condition: service_healthy
    networks:
        - symfony

services:
  php:
    image: filebot-handler-php:dev
    build:
      context: .
      target: php
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - ./:/app
      - "${DOWNLOAD_VOL}:${TORRENTS_ROOT}:rw"
      - "${STORAGE_VOL}:${STORAGE_ROOT}:rw"
    environment:
      HOME: /tmp
      APP_ENV: dev
      TZ: "${TZ:-UTC}"
      AMC_UNSORTED: "${AMC_UNSORTED:-n}"
    depends_on:
        redis:
            condition: service_healthy
    expose:
      - "9000"
    networks:
      - symfony

  worker:
    <<: *worker
    hostname: worker-1

  nginx:
    image: filebot-handler-nginx:dev
    build:
      context: .
      target: nginx
    profiles:
      - dev
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    environment:
      TZ: "${TZ:-UTC}"
    depends_on:
      php:
          condition: service_healthy
    networks:
      - symfony

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - 'everysec'
    volumes:
        - redis_data:/data
    networks:
      - symfony
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 3

volumes:
  redis_data:

networks:
  symfony:
    driver: bridge
