services:
  php:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      APP_ENV: dev
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    expose:
      - "9000"
    networks:
      - symfony

  nginx:
    image: nginx:stable-alpine
    profiles:
      - dev
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - symfony

networks:
  symfony:
    driver: bridge
