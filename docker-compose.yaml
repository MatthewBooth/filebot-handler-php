services:
  php:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      APP_ENV: dev
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    depends_on:
        redis:
            condition: service_healthy
    expose:
      - "9000"
    networks:
      - symfony

  nginx:
    image: nginx:stable-alpine
    profiles:
      - dev
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
          condition: service_healthy
    networks:
      - symfony

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - 'everysec'
    volumes:
        - redis_data:/data
    networks:
      - symfony
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 3

volumes:
    redis_data:

networks:
  symfony:
    driver: bridge
